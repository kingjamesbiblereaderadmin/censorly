name: Safari iOS Build

on:
  workflow_dispatch:

jobs:
  build-ios-simulator:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Validate Safari source
        run: |
          set -eu
          python3 - <<'PY'
          import json, pathlib
          src = pathlib.Path('safari')
          m = json.loads((src/'manifest.json').read_text())
          assert m['manifest_version'] == 3
          assert m['background']['service_worker'] == 'background.js'
          for name in ('background.js', 'content.js', 'popup.js', 'popup.html', 'app-icon-512.png'):
              assert (src/name).is_file(), name
          print('Safari web extension', m['version'], 'source validated')
          PY

      - name: Package iOS Safari web extension
        run: |
          set -eu
          if xcrun --find safari-web-extension-packager >/dev/null 2>&1; then
            TOOL=safari-web-extension-packager
          else
            TOOL=safari-web-extension-converter
          fi
          xcrun "$TOOL" "$PWD/safari" \
            --app-name Censorly \
            --bundle-identifier Com.censorly.extension \
            --project-location "$PWD" \
            --ios-only --swift --copy-resources --no-open --no-prompt --force
          test -d Censorly/Censorly.xcodeproj
          xcodebuild -list -project Censorly/Censorly.xcodeproj

      - name: Set iOS app icon
        run: |
          set -eu
          APPICON_DIR=$(find "$PWD/Censorly" -type d -name AppIcon.appiconset | head -n 1)
          test -n "$APPICON_DIR"
          export APPICON_DIR
          sips -z 1024 1024 "$PWD/safari/app-icon-512.png" --out "$APPICON_DIR/Censorly-1024.png" >/dev/null
          python3 - <<'PY'
          import json, os
          path = os.path.join(os.environ['APPICON_DIR'], 'Contents.json')
          with open(path,'w') as f:
              json.dump({'images':[{'filename':'Censorly-1024.png','idiom':'universal','platform':'ios','size':'1024x1024'}],
                         'info':{'author':'xcode','version':1}},f,indent=2)
          print('Set iOS app icon at', path)
          PY

      - name: Build iOS Simulator app
        run: |
          set -eu
          PROJ="$PWD/Censorly/Censorly.xcodeproj"
          SCHEME=$(xcodebuild -list -project "$PROJ" -json | python3 -c 'import json,sys; s=json.load(sys.stdin)["project"]["schemes"]; print(next((v for v in s if "iOS" in v),s[0]))')
          echo "Building scheme: $SCHEME"
          xcodebuild build \
            -project "$PROJ" -scheme "$SCHEME" \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$PWD/derived-data" \
            CODE_SIGNING_ALLOWED=NO
          APP=$(find "$PWD/derived-data/Build/Products" -maxdepth 2 -type d -name Censorly.app | head -n 1)
          test -n "$APP"
          test -d "$APP/PlugIns"
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$APP" dist/Censorly-iOS-Simulator.zip

      - name: Launch app in iPhone simulator
        run: |
          set -eu
          UDID=$(xcrun simctl list devices available | python3 - <<'PY'
          import re
          out = open(0).read()
          m = re.search(r'^\s*(iPhone[\w ]*?)\s*\(([-0-9A-Fa-f]+)\)', out, re.M)
          assert m, 'No available iPhone simulator found'
          print(m.group(2))
          PY
          )
          echo "Booting iPhone simulator $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          APP=$(find "$PWD/derived-data/Build/Products" -maxdepth 2 -type d -name Censorly.app | head -n 1)
          test -n "$APP"
          xcrun simctl install "$UDID" "$APP"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")
          echo "Launching $BUNDLE_ID in simulator"
          xcrun simctl launch "$UDID" "$BUNDLE_ID"
          sleep 6
          if ! pgrep -f 'Censorly.app/Censorly' >/dev/null; then
            echo 'Censorly did not stay running in the simulator'
            exit 1
          fi
          echo 'Censorly launched and stayed running in the iPhone simulator'

      - name: Attach unsigned simulator build
        uses: actions/upload-artifact@v4
        with:
          name: Censorly-iOS-Simulator-unsigned
          path: dist/Censorly-iOS-Simulator.zip
          if-no-files-found: error

      - name: Attach Xcode project
        run: |
          set -eu
          VERSION=$(python3 -c "import json; print(json.load(open('safari/manifest.json'))['version'])")
          ditto -c -k --sequesterRsrc --keepParent "$PWD/Censorly" "dist/Censorly-v${VERSION}-iOS-Xcode-project.zip"
          unzip -t "dist/Censorly-v${VERSION}-iOS-Xcode-project.zip" >/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: Censorly-iOS-Xcode-project
          path: dist/Censorly-v*-iOS-Xcode-project.zip
          if-no-files-found: error
